<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Houstory — Sign in</title>
  <link rel="stylesheet" href="houstory.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>Houstory</h1>
    <p>Sign in</p>
  </header>
  <main>
    <div class="card">
      <button type="button" id="googleSignInBtn" class="hs-btn-google">
        <svg width="18" height="18" viewBox="0 0 48 48" style="margin-right:10px; flex-shrink:0;">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>

      <p style="text-align:center; color: var(--hs-muted); margin: 1rem 0;">— or —</p>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
        <button type="submit" id="loginBtn">Sign in</button>
      </form>
      <p id="errorBox" class="error" style="display:none;"></p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://yrsvewqvkbjfwzpldjjy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlyc3Zld3F2a2JqZnd6cGxkamp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5ODEzMzMsImV4cCI6MjEwMDU1NzMzM30.SZrhC-HvbbRM2_pKV_WA-OE5uIic0f7ZuMfytcgNofA";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("errorBox");
    const loginBtn = document.getElementById("loginBtn");
    const googleSignInBtn = document.getElementById("googleSignInBtn");

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        window.location.href = "app.html";
      }
    });

    googleSignInBtn.addEventListener("click", async () => {
      errorBox.style.display = "none";
      googleSignInBtn.disabled = true;

      const { error } = await sb.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: `${window.location.origin}/app.html` },
      });

      // On success, Supabase redirects the whole page to Google - this
      // line only runs if signInWithOAuth itself failed to even start
      // (e.g. the Google provider isn't configured in Supabase yet).
      if (error) {
        showError(error.message);
        googleSignInBtn.disabled = false;
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in…";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        showError(error.message);
        loginBtn.disabled = false;
        loginBtn.textContent = "Sign in";
        return;
      }

      window.location.href = "app.html";
    });
  </script>
</body>
</html>
