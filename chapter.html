<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Houstory — Chapter</title>
  <link rel="stylesheet" href="houstory.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>Houstory</h1>
    <p><a href="app.html">&larr; Back</a></p>
  </header>
  <main>
    <div id="chapterCard" class="card">
      <p class="status">Loading…</p>
    </div>

    <div id="photosCard" class="card" style="margin-top:1rem; display:none;">
      <p>Photos</p>
      <div id="photoGrid"></div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://yrsvewqvkbjfwzpldjjy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlyc3Zld3F2a2JqZnd6cGxkamp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5ODEzMzMsImV4cCI6MjEwMDU1NzMzM30.SZrhC-HvbbRM2_pKV_WA-OE5uIic0f7ZuMfytcgNofA";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CHAPTER_TYPES = ["renovation", "landscaping", "paint", "appliance", "research", "general"];

    const chapterCard = document.getElementById("chapterCard");
    const photosCard = document.getElementById("photosCard");
    const photoGrid = document.getElementById("photoGrid");

    const params = new URLSearchParams(location.search);
    const chapterId = params.get("id");

    let propertyId = null;
    let otherChapters = [];

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // houstory-96t.30: minimal, safe subset of markdown -> HTML for
    // Claude's responses (bold section headers, clickable links). Not a
    // full markdown parser on purpose - tables/lists stay as plain text.
    // Text is HTML-escaped FIRST, so everything inserted after that point
    // is only the specific tags built here, never raw text from Claude.
    function renderClaudeResponse(text) {
      if (!text) return "";
      let html = escapeHtml(text);

      html = html.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<]+)/g,
        (match, linkText, linkUrl, bareUrl) => {
          if (linkUrl) return `<a href="${linkUrl}" target="_blank" rel="noopener">${linkText}</a>`;
          const trailing = (bareUrl.match(/[.,;:!?)]+$/) || [""])[0];
          const cleanUrl = trailing ? bareUrl.slice(0, -trailing.length) : bareUrl;
          return `<a href="${cleanUrl}" target="_blank" rel="noopener">${cleanUrl}</a>${trailing}`;
        }
      );

      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/^#{1,6}\s*(.+)$/gm, "<strong>$1</strong>");

      return html;
    }

    function deriveSummary(text, maxLen = 70) {
      if (!text) return "No description yet.";
      const firstLine = text.split("\n").find(l => l.trim().length > 0) || text;
      const cleaned = firstLine.replace(/^#{1,6}\s*/, "").replace(/\*\*/g, "").trim();
      return cleaned.length > maxLen ? cleaned.slice(0, maxLen) + "…" : cleaned;
    }

    // houstory-96t.31: shared collapse/expand wiring for a card that has a
    // .card-summary (click target) and a .card-body (the collapsible part).
    function wireCardToggle(card, startExpanded) {
      const body = card.querySelector(".card-body");
      const toggle = card.querySelector(".card-expand-toggle");
      body.style.display = startExpanded ? "block" : "none";
      toggle.classList.toggle("open", !!startExpanded);

      card.querySelector(".card-summary").addEventListener("click", () => {
        const isOpen = body.style.display !== "none";
        body.style.display = isOpen ? "none" : "block";
        toggle.classList.toggle("open", !isOpen);
      });
    }

    function typeOptionsHtml(selected) {
      return CHAPTER_TYPES.map(t => `<option value="${t}" ${t === selected ? "selected" : ""}>${t}</option>`).join("");
    }

    function statusOptionsHtml(selected) {
      return ["active", "completed", "archived"]
        .map(s => `<option value="${s}" ${s === selected ? "selected" : ""}>${s}</option>`)
        .join("");
    }

    async function loadChapter() {
      if (!chapterId) {
        chapterCard.innerHTML = `<p class="error">No chapter id given.</p>`;
        return;
      }

      const { data: chapter, error } = await sb
        .from("chapters")
        .select("id, property_id, title, chapter_type, description, status, metadata")
        .eq("id", chapterId)
        .single();

      if (error || !chapter) {
        chapterCard.innerHTML = `<p class="error">Chapter not found or not accessible.</p>`;
        return;
      }

      propertyId = chapter.property_id;

      // Load other chapters before rendering so the merge dropdown can be
      // built into the initial HTML rather than added in a second pass.
      await loadOtherChapters();

      chapterCard.innerHTML = `
        <label>Title</label>
        <input type="text" class="ch-title" value="${chapter.title.replace(/"/g, "&quot;")}">
        <label>Category</label>
        <select class="ch-type">${typeOptionsHtml(chapter.chapter_type)}</select>
        <label>Description</label>
        <textarea class="ch-description" rows="3">${chapter.description || ""}</textarea>
        <label>Status</label>
        <select class="ch-status">${statusOptionsHtml(chapter.status)}</select>
        <button type="button" class="ch-save">Save changes</button>
        <button type="button" class="ch-delete" style="background:#b3261e;">Delete chapter</button>
        <p class="ch-error error" style="display:none;"></p>
        <div style="margin-top:1rem; padding-top:1rem; border-top:1px solid var(--hs-border);">
          <label>Merge into another chapter</label>
          <select class="ch-merge-target">
            <option value="">— choose a chapter —</option>
            ${otherChapters.map(c => `<option value="${c.id}">${c.title}</option>`).join("")}
          </select>
          <button type="button" class="ch-merge-btn" ${otherChapters.length === 0 ? "disabled" : ""}>Merge into selected chapter</button>
        </div>
      `;

      chapterCard.querySelector(".ch-save").addEventListener("click", async () => {
        const saveBtn = chapterCard.querySelector(".ch-save");
        const chError = chapterCard.querySelector(".ch-error");
        chError.style.display = "none";
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";

        const { error: updateError } = await sb
          .from("chapters")
          .update({
            title: chapterCard.querySelector(".ch-title").value.trim(),
            chapter_type: chapterCard.querySelector(".ch-type").value,
            description: chapterCard.querySelector(".ch-description").value.trim() || null,
            status: chapterCard.querySelector(".ch-status").value,
          })
          .eq("id", chapterId);

        saveBtn.disabled = false;
        saveBtn.textContent = "Save changes";

        if (updateError) {
          chError.textContent = updateError.message;
          chError.style.display = "block";
          return;
        }

        saveBtn.textContent = "Saved";
        setTimeout(() => { saveBtn.textContent = "Save changes"; }, 1500);
      });

      chapterCard.querySelector(".ch-delete").addEventListener("click", async () => {
        const ok = confirm(`Delete "${chapter.title}"? Its photos will NOT be deleted - they'll become unfiled and show up in the Unfiled section of the Analyze page.`);
        if (!ok) return;

        const deleteBtn = chapterCard.querySelector(".ch-delete");
        deleteBtn.disabled = true;
        deleteBtn.textContent = "Deleting…";

        // Unfile photos back to pending_review BEFORE deleting the chapter -
        // the FK is ON DELETE SET NULL, but that alone would leave them
        // status='confirmed' with no chapter, invisible to the "needs
        // review" query on the upload page.
        await sb.from("media").update({ status: "pending_review" }).eq("chapter_id", chapterId);

        const { error: deleteError } = await sb.from("chapters").delete().eq("id", chapterId);

        if (deleteError) {
          const chError = chapterCard.querySelector(".ch-error");
          chError.textContent = deleteError.message;
          chError.style.display = "block";
          deleteBtn.disabled = false;
          deleteBtn.textContent = "Delete chapter";
          return;
        }

        window.location.href = "app.html";
      });

      chapterCard.querySelector(".ch-merge-btn").addEventListener("click", async () => {
        const mergeSelect = chapterCard.querySelector(".ch-merge-target");
        const targetId = mergeSelect.value;
        if (!targetId) {
          alert("Choose a chapter to merge into first.");
          return;
        }
        const targetTitle = mergeSelect.selectedOptions[0].textContent;

        const ok = confirm(`Merge "${chapter.title}" into "${targetTitle}"? All its photos will move there, and "${chapter.title}" will be deleted.`);
        if (!ok) return;

        const mergeBtn = chapterCard.querySelector(".ch-merge-btn");
        const chError = chapterCard.querySelector(".ch-error");
        chError.style.display = "none";
        mergeBtn.disabled = true;
        mergeBtn.textContent = "Merging…";

        const { error: moveError } = await sb
          .from("media")
          .update({ chapter_id: targetId })
          .eq("chapter_id", chapterId);

        if (moveError) {
          chError.textContent = moveError.message;
          chError.style.display = "block";
          mergeBtn.disabled = false;
          mergeBtn.textContent = "Merge into selected chapter";
          return;
        }

        // Fold this chapter's metadata/description into the target's,
        // preferring the target's own values where both have something -
        // it's the chapter that survives.
        const { data: targetChapter, error: targetErr } = await sb
          .from("chapters")
          .select("metadata, description")
          .eq("id", targetId)
          .single();

        if (targetErr) {
          chError.textContent = targetErr.message;
          chError.style.display = "block";
          mergeBtn.disabled = false;
          mergeBtn.textContent = "Merge into selected chapter";
          return;
        }

        const mergedMetadata = { ...(chapter.metadata || {}), ...(targetChapter.metadata || {}) };
        const mergedDescription = targetChapter.description || chapter.description || null;

        await sb
          .from("chapters")
          .update({ metadata: mergedMetadata, description: mergedDescription })
          .eq("id", targetId);

        const { error: deleteError } = await sb.from("chapters").delete().eq("id", chapterId);

        if (deleteError) {
          chError.textContent = deleteError.message;
          chError.style.display = "block";
          mergeBtn.disabled = false;
          mergeBtn.textContent = "Merge into selected chapter";
          return;
        }

        window.location.href = `chapter.html?id=${targetId}`;
      });

      await loadPhotos();
    }

    async function loadOtherChapters() {
      const { data, error } = await sb
        .from("chapters")
        .select("id, title")
        .eq("property_id", propertyId)
        .neq("id", chapterId)
        .order("created_at", { ascending: false });

      if (!error) otherChapters = data || [];
    }

    async function loadPhotos() {
      const { data: photos, error } = await sb
        .from("media")
        .select("id, storage_path, caption, title, ai_description, upload_batch_id")
        .eq("chapter_id", chapterId)
        .order("created_at", { ascending: true });

      if (error || !photos || photos.length === 0) return;

      photosCard.style.display = "block";
      photoGrid.innerHTML = "";

      // houstory-xq7: photos submitted together share an upload_batch_id and
      // one Claude description (upload.html's Unfiled gallery already groups
      // on this - this mirrors that same logic, which chapter.html never had,
      // so filed batches kept showing one duplicate card per photo).
      const groups = [];
      const batchIndex = new Map();
      for (const row of photos) {
        if (row.upload_batch_id && batchIndex.has(row.upload_batch_id)) {
          groups[batchIndex.get(row.upload_batch_id)].push(row);
        } else {
          if (row.upload_batch_id) batchIndex.set(row.upload_batch_id, groups.length);
          groups.push([row]);
        }
      }

      for (const group of groups) {
        const signedUrls = await Promise.all(
          group.map(row => sb.storage.from("houstory-media").createSignedUrl(row.storage_path, 3600))
        );

        const firstThumb = signedUrls[0]?.data?.signedUrl;
        const imagesHtml = signedUrls
          .map(({ data }) => data
            ? `<img src="${data.signedUrl}" alt="" style="max-width:${group.length > 1 ? "47%" : "100%"}; display:inline-block; margin:0 2% 0.5rem 0; border-radius:8px;">`
            : "")
          .join("");

        const sharedTitle = group[0].title || "";
        const sharedDescription = group[0].ai_description || "";

        const el = document.createElement("div");
        el.className = "card";
        el.style.marginTop = "1rem";
        el.innerHTML = `
          <div class="card-summary">
            ${firstThumb ? `<img src="${firstThumb}" alt="" class="card-summary-thumb">` : ""}
            <span class="card-summary-title"></span>
            <span class="card-expand-toggle">&#9656;</span>
          </div>
          <div class="card-body">
            ${imagesHtml}
            <label>Title</label>
            <input type="text" class="ph-title" value="${sharedTitle.replace(/"/g, "&quot;")}">
            <label>Description</label>
            <div class="rendered-response ph-description-view" style="white-space:pre-wrap;"></div>
            <textarea class="ph-description" rows="4" style="display:none;">${sharedDescription}</textarea>
            <button type="button" class="ph-edit-toggle">Edit description</button>
            <label>Move to</label>
            <select class="ph-move">
              <option value="">— keep here —</option>
              ${otherChapters.map(c => `<option value="${c.id}">${c.title}</option>`).join("")}
            </select>
            <button type="button" class="ph-save">Save</button>
            <button type="button" class="ph-delete" style="background:#b3261e;">Delete photo${group.length > 1 ? "s" : ""}</button>
            <p class="ph-error error" style="display:none;"></p>
          </div>
        `;
        el.querySelector(".card-summary-title").textContent = sharedTitle || deriveSummary(sharedDescription);
        el.querySelector(".ph-description-view").innerHTML = renderClaudeResponse(sharedDescription) || "No description yet.";
        photoGrid.appendChild(el);
        wireCardToggle(el, false); // browsing chapter photos - collapsed by default

        el.querySelector(".ph-edit-toggle").addEventListener("click", () => {
          const view = el.querySelector(".ph-description-view");
          const textarea = el.querySelector(".ph-description");
          const editBtn = el.querySelector(".ph-edit-toggle");
          const nowEditing = textarea.style.display === "none";
          view.style.display = nowEditing ? "none" : "block";
          textarea.style.display = nowEditing ? "block" : "none";
          if (!nowEditing) view.innerHTML = renderClaudeResponse(textarea.value) || "No description yet.";
          editBtn.textContent = nowEditing ? "Done editing" : "Edit description";
        });

        el.querySelector(".ph-save").addEventListener("click", async () => {
          const saveBtn = el.querySelector(".ph-save");
          const phError = el.querySelector(".ph-error");
          phError.style.display = "none";
          saveBtn.disabled = true;
          saveBtn.textContent = "Saving…";

          const newTitle = el.querySelector(".ph-title").value.trim();
          const newDescription = el.querySelector(".ph-description").value.trim();
          const moveTo = el.querySelector(".ph-move").value;

          const updates = { title: newTitle || null, ai_description: newDescription };
          if (moveTo) updates.chapter_id = moveTo;

          const { error: updateError } = await sb.from("media").update(updates).in("id", group.map(row => row.id));

          if (updateError) {
            phError.textContent = updateError.message;
            phError.style.display = "block";
            saveBtn.disabled = false;
            saveBtn.textContent = "Save";
            return;
          }

          if (moveTo) {
            el.remove();
          } else {
            el.querySelector(".card-summary-title").textContent = newTitle || deriveSummary(newDescription);
            el.querySelector(".ph-description-view").innerHTML = renderClaudeResponse(newDescription) || "No description yet.";
            saveBtn.disabled = false;
            saveBtn.textContent = "Saved";
            setTimeout(() => { saveBtn.textContent = "Save"; }, 1500);
          }
        });

        el.querySelector(".ph-delete").addEventListener("click", async () => {
          const count = group.length;
          const ok = confirm(`Delete ${count} photo${count > 1 ? "s" : ""}? This can't be undone.`);
          if (!ok) return;

          const deleteBtn = el.querySelector(".ph-delete");
          deleteBtn.disabled = true;
          deleteBtn.textContent = "Deleting…";

          await sb.storage.from("houstory-media").remove(group.map(row => row.storage_path));
          const { error: deleteError } = await sb.from("media").delete().in("id", group.map(row => row.id));

          if (deleteError) {
            const phError = el.querySelector(".ph-error");
            phError.textContent = deleteError.message;
            phError.style.display = "block";
            deleteBtn.disabled = false;
            deleteBtn.textContent = `Delete photo${count > 1 ? "s" : ""}`;
            return;
          }

          el.remove();
        });
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
        return;
      }
      await loadChapter();
    });
  </script>
</body>
</html>
